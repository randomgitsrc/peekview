  findings: "这是一张名为 **PeekView** 的 Web 端 Markdown 文档/资源预览系统的界面截图。\n\n---\n\n### 一、 整体结构与布局\n\n页面整体采用标准的 **三栏布局**（顶部导航栏 + 左侧文件树\
    \ + 中间正文区 + 右侧大纲导航），风格简洁明亮，背景为浅灰/白色。\n\n---\n\n### 二、 各区域详细内容\n\n#### 1. 顶部导航栏 (Header)\n* **左侧**：\n  * 系统 Logo 与名称：带蓝色\
    \ `P` 字母图标 + `PeekView`\n  * 竖线分隔符\n  * 当前文档标题：`非 ASCII 文件名本地资源引用 (TPV0089 E2E fixture)`\n  * 下方元信息：`@alice · 9h ago ·\
    \ Expires in 15d` | 标签：`Public` | 蓝色高亮标签 `unicode` | 灰色标签 `文件名`、`图片`、`回归`\n* **右侧**：\n  * 功能图标：蓝色文件夹图标（带角标 `8`）、列表图标、代码图标\
    \ `<>`、复制图标、更多选项 `...`\n  * 按钮与设置：`Sign in` 登录按钮、深色模式切换图标（月亮）\n\n#### 2. 左侧文件树 (Left Sidebar - `FILES · 8`)\n包含了当前项目中的\
    \ 8 个资源文件，当前**选中高亮状态**的项为 `README.md`（浅蓝色背景背景框）：\n* `arch.png`（棕色箱子/图片图标）\n* `café.png`（棕色箱子/图片图标）\n* `english-notes.txt`（文档图标）\n\
    * **`README.md`**（编辑文档图标，**处于选中状态**）\n* `report final.png`（棕色箱子/图片图标）\n* `中文图片.png`（棕色箱子/图片图标）\n* `报告附件.txt`（文档图标）\n*\
    \ `概要图.png`（棕色箱子/图片图标）\n\n#### 3. 右侧大纲栏 (ON THIS PAGE)\n提取了中间正文的所有 H2 级标题目录：\n* `中文文件名图片`\n* `日文文件名图片`\n* `带重音拉丁字符文件名图片`\n\
    * `含空格文件名图片`\n* `英文文件名图片（回归对照）`\n* `附件链接`\n* `说明`\n\n---\n\n### 三、 验证结果：图片渲染状态与排版乱码检查\n\n根据您的要求，对中间正文 Markdown 渲染区域进行逐项排查：\n\
    \n#### 1. 乱码与布局崩坏排查\n* **文本与符号**：所有中文字符、英文字符、数字（如 `TPV0089`、`BDD-10~13`）以及特殊字符（如左侧的 `café.png` 中的 `é`）**全部正常显示，无任何乱码或字符替代方块**。\n\
    * **页面布局**：三栏比例协调，标题、分割线、段落间距等结构正常，**无错位、重叠或布局崩坏问题**。\n\n#### 2. 可见图片渲染状态逐张核查列表\n\n| 序号 | 对应标题 | 图片实际渲染状态 | 结论 |\n| :---\
    \ | :--- | :--- | :--- |\n| **1** | 中文文件名图片 | 正常渲染，显示为**红色**实心方块图 | **无裂图** |\n| **2** | 日文文件名图片 | 正常渲染，显示为**蓝色**实心方块图\
    \ | **无裂图** |\n| **3** | 带重音拉丁字符文件名图片 | 正常渲染，显示为**绿色**实心方块图 | **无裂图** |\n| **4** | 含空格文件名图片 | 正常渲染，显示为**橙黄色**实心方块图 | **无裂图**\
    \ |\n| **5** | 英文文件名图片（回归对照） | 正常渲染，显示为**紫色**实心方块图（位于视图最底部） | **无裂图** |\n\n### 总结\n该页面中引用的所有非 ASCII 及特殊文件名图片均**成功真实渲染**（以不同颜色的测试图块形式呈现），**未出现任何图片破损图标（裂图）**，且页面**无乱码、无布局崩坏**。"
