  image: P6-evidence/screenshots/bdd10_desktop_1280x800.png
  findings: "这是一张网页 UI 截图，展示了一个名为 **PeekView** 的在线文档/文件预览系统的界面，正在预览一个名为 `README.md` 的 Markdown 文档。\n\n---\n\n### 一、 总体结构拆解\n\
    \n页面采用了典型的三栏式 Web 应用布局：\n\n1. **顶部导航栏 (Header Bar)**：\n   * **左侧**：包含产品 Logo `P PeekView`、分隔线以及文档主标题 `非 ASCII 文件名本地资源引用\
    \ (TPV0089 E2E fixture)`。\n   * **标题下方**：元信息标签，包括作者 `@alice`、时间 `9h ago`、过期时间 `Expires in 15d`，以及蓝色/灰色标签项：`Public`、`unicode`、`文件名`、`图片`、`回归`。\n\
    \   * **右侧**：工具栏图标，包括带数字 `8` 的文件夹图标、列表图标、`<>` 代码图标、复制图标、`...` 更多操作下拉菜单，以及 `Sign in`（登录）按钮和暗黑模式切换（月亮）图标。\n\n2. **左侧文件列表栏\
    \ (Left Sidebar)**：\n   * 顶部显示标题及数量：`FILES · 8`。\n   * 包含 8 个文件构成的文件树列表（当前选中项为 `README.md`，呈淡蓝色高亮背景）：\n     * `arch.png`（包裹/图片图标）\n\
    \     * `café.png`（包裹/图片图标，带有重音字符 `é`）\n     * `english-notes.txt`（文本图标）\n     * **`README.md`**（编辑高亮状态， Markdown 文件图标）\n\
    \     * `report final.png`（包裹/图片图标，带空格）\n     * `中文图片.png`（包裹/图片图标）\n     * `报告附件.txt`（文本图标）\n     * `概要图.png`（包裹/图片图标）\n\
    \n3. **中间主内容预览区 (Main Content Area)**：\n   * 展示 `README.md` 的 Markdown 渲染效果。\n   * 大标题 (H1)：`Unicode 文件名资源引用（TPV0089 fixture）`\n\
    \   * 说明段落：`本 entry 用于端到端验证非 ASCII 文件名本地资源的链接解析修复（BDD-10~13）。`\n   * 下方依次为各个测试小节标题（H2/H4）与对应的展示图片（测试用单色块图片）。\n\n4. **右侧大纲导航栏\
    \ (Right Sidebar - \"ON THIS PAGE\")**：\n   * 页面文章目录（TOC），按顺序列出文档内的锚点链接：`中文文件名图片`、`日文文件名图片`、`带重音拉丁字符文件名图片`、`含空格文件名图片`、`英文文件名图片（回归对照）`、`附件链接`、`说明`。\n\
    \n---\n\n### 二、 专项验证（针对用户提问）\n\n#### 1. 图片渲染状态逐张排查（无裂图验证）\n\n页面中用于测试的图片均为单色填充测试图（E2E 测试标准 fixture），**全部正常加载渲染，未出现任何破损图标（裂图/占位红叉）**：\n\
    \n* **第 1 张图片**（位于 `中文文件名图片` 下）：**纯红色方块**，渲染正常，无裂图。\n* **第 2 张图片**（位于 `日文文件名图片` 下）：**纯蓝色方块**，渲染正常，无裂图。\n* **第 3 张图片**（位于\
    \ `带重音拉丁字符文件名图片` 下）：**纯绿色方块**，渲染正常，无裂图。\n* **第 4 张图片**（位于 `含空格文件名图片` 下）：**纯黄/橙色方块**，渲染正常，无裂图。\n* **第 5 张图片**（位于 `英文文件名图片（回归对照）`\
    \ 下）：由于页面滚动位置原因，仅露出顶部边缘（呈现紫/深蓝色边缘），**渲染正常，无裂图**。\n\n#### 2. 文本乱码检查\n* **检查结果：无乱码。**\n* 中文字符（如 `非 ASCII 文件名本地资源引用`、`中文文件名图片`、`报告附件.txt`\
    \ 等）显示清晰正确。\n* 特殊 Unicode/拉丁扩展字符（如左侧文件列表中的 `café.png`）的重音符号 `é` 渲染正确，无方框或 `?` 替代符。\n\n#### 3. 布局状态检查\n* **检查结果：无布局崩坏。**\n\
    * 左右侧边栏与中间内容区对齐整齐，各级标题下方的水平分割线展示规范，元素间距（Padding/Margin）正常。"
