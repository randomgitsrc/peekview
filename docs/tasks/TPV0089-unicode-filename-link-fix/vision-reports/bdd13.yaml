  image: P6-evidence/screenshots/bdd13_english_desktop.png
  findings: "这是一张 **PeekView** Web 端文档/资源预览界面的完整截图。页面整体风格简洁明亮，布局划分为顶部导航栏、左侧文件列表边栏、中间主内容区以及右侧目录导航栏。\n\n---\n\n### 一、 界面结构拆解\n\
    \n#### 1. 顶部导航栏 (Top Navigation Bar)\n* **左侧区**：\n  * **Logo**：蓝色图标包含字母 `P`，旁边有品牌名称 `PeekView`。\n  * **主标题**：`非 ASCII\
    \ 文件名本地资源引用 (TPV0089 E2E fixture)`\n  * **元信息（标题下方）**：`@alice` • `9h ago` • `Expires in 15d` | `785 reads` • `Public`\n\
    \  * **标签/Badge组**：`unicode`、`文件名`、`图片`、`回归`（均呈浅蓝色或灰底气泡形式）。\n* **右侧区（操作与用户状态）**：\n  * 图标按钮组：带数字 `8` 的蓝色角标文件夹图标、列表图标、代码图标\
    \ `<>`、复制图标、更多选项 `...`。\n  * 用户信息：蓝色头像 `A`，用户名 `alice`，蓝色高亮标签 `ADMIN`。\n  * 主题切换：月亮图标（暗黑模式切换）。\n\n---\n\n#### 2. 左侧边栏\
    \ (Files Sidebar)\n* **顶部标题**：`FILES · 8`\n* **文件列表**：\n  1. `报告附件.txt`（文本图标）\n  2. `概要图.png`（图片图标）\n  3. `中文图片.png`（图片图标）\n\
    \  4. `arch.png`（图片图标）\n  5. `café.png`（图片图标，含重音字符）\n  6. `english-notes.txt`（文本图标）\n  7. `README.md`（**当前选中状态**：浅蓝色高亮背景，Markdown编辑图标）\n\
    \  8. `report final.png`（图片图标）\n\n---\n\n#### 3. 中间主内容区 (Main Content Area - Markdown 渲染)\n按照自上而下的顺序依次显示：\n\n1. **标题**：`带重音拉丁字符文件名图片`\n\
    \   * **内容**：渲染出一个**绿色**的实心正方形图片方块。\n2. **标题**：`含空格文件名图片`\n   * **内容**：渲染出一个**橙黄色**的实心正方形图片方块。\n3. **标题**：`英文文件名图片（回归对照）`\n\
    \   * **内容**：渲染出一个**紫色**的实心正方形图片方块（图像加载正常，显示完整，无裂图图标）。\n4. **标题**：`附件链接`\n   * **内容**：无序列表包含两个蓝色超链接：\n     * `• 中文附件下载`\n\
    \     * `• English attachment`\n5. **标题**：`说明`\n   * **内容**：一段说明文本：\n     > `上面的图片与附件均通过相对路径引用。文件名包含中文 / 日文 / 重音拉丁字符 /\
    \ 空格，修复前 markdown-it 会将其 percent-encode（如 images/%E4%B8%AD%E6%99%82...png），resolvePath 因缺少 decode 而匹配失败，导致图片裂图 / 链接死链；修复后应全部正常渲染。`\n\
    \     *(其中 `images/%E4%B8%AD%E6%99%82...png` 和 `resolvePath` 带有行内代码浅灰背景块)*\n\n---\n\n#### 4. 右侧边栏 (Right Sidebar - TOC\
    \ 目录)\n* **标题**：`ON THIS PAGE`\n* **大纲列表**：\n  * `中文文件名图片`\n  * `日文文件名图片`\n  * `带重音拉丁字符文件名图片`\n  * `含空格文件名图片`\n  * `英文文件名图片（回归对照）`\n\
    \  * `附件链接`\n  * `说明`\n\n---\n\n### 二、 针对验证项的检查结论\n\n1. **英文图片（紫色方块）渲染**：\n   * **状态**：**正常**。`英文文件名图片（回归对照）` 下方正确渲染出实心紫色方块，无占位缺失、无裂图/破损图标。\n\
    2. **`English attachment` 链接**：\n   * **状态**：**可见且正常**。位于 `附件链接` 标题下的第二个列表项，呈现标准的蓝色可点击链接样式。\n3. **页面乱码与布局状态**：\n   * **状态**：**良好**。\n\
    \     * 中文、英文、特殊字符（如 `café.png` 中的 `é`）、代码转义字符均正常显示，**无任何乱码/方框问号**。\n     * 三栏布局（左侧文件树、中间内容、右侧目录）及顶栏结构严丝合缝，无重叠、错位或布局崩坏现象。"
