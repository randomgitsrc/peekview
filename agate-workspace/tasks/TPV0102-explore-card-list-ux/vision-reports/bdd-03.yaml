    prompt: '这是 PeekView **entry 详情页**的移动视口截图（宽 390）。请核对：①元信息条（作者、时间一带）的时间文本是否为绝对时间且含 4 位年份与 GMT±N 偏移？请抄录该时间文本。②是否出现 "N ago"/"just now" 作为主显时间？另外：是否存在布局溢出、文字被裁切、元素重叠遮挡、空白破图等 blocker 级视觉缺陷？请最后单独一行给出 "Blocker 数量: N"。'
    model: xrouter/nx-vision
    blocker_count: 0
    rc: 0
    response: '① 元信息条的时间文本为绝对时间，且含 4 位年份与 GMT 偏移；抄录如下：


