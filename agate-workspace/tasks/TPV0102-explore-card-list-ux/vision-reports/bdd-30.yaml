  prompt: '这是 PeekView Explore 页面的截图，其中左上第一张卡片的**可见性菜单处于打开状态**。请：①把该菜单浮层内所有可见项文本逐条抄录。②菜单是否清晰可见（未被裁切/遮挡）？另外：是否存在布局溢出、文字被裁切、元素重叠遮挡、空白破图等 blocker 级视觉缺陷？请最后单独一行给出 "Blocker 数量: N"。 || 这是 PeekView Explore 页面的截图，拍摄于上一步按了 **Escape 键之后**。请核对：①画面上是否还残留任何可见性菜单浮层（含 Public/Private/Team 项的白色浮层）？请明确回答"有"或"没有"。②左上第一张卡片右上角的可见性触发按钮周围是否有焦点环/高亮描边（表示焦点回到该按钮）？若无法判定请明确说明。另外：是否存在布局溢出、文字被裁切、元素重叠遮挡、空白破图等 blocker 级视觉缺陷？请最后单独一行给出 "Blocker 数量: N"。'
  summary:
    blocker_count: 0
