  prompt: '这是 PeekView Explore 页面的**卡片模式（网格）**截图。请核对：①每条 entry 卡片的时间文本是否为绝对时间，含 4 位年份与 "GMT+N" / "GMT-N" 偏移标识（请抄录其中 2 条时间文本原样）？②是否存在 "3h ago"、"just now" 这类相对时间被当作条目主显？（注意：卡片内可见 "Public"/"仅团队可见" 徽章属可见性状态，不是时间）另外：是否存在布局溢出、文字被裁切、元素重叠遮挡、空白破图等 blocker 级视觉缺陷？请最后单独一行给出 "Blocker 数量: N"。 || 这是 PeekView Explore 页面的**列表模式（单列）**截图。请核对：①每个 entry 行的时间文本是否为绝对时间，含 4 位年份与 GMT±N 偏移标识（请抄录其中 2 条原样）？②是否存在 "3h ago"、"just now" 这类相对时间被当作条目主显？另外：是否存在布局溢出、文字被裁切、元素重叠遮挡、空白破图等 blocker 级视觉缺陷？请最后单独一行给出 "Blocker 数量: N"。'
  summary:
