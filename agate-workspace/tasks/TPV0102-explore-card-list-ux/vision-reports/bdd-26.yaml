  prompt: '这是 PeekView Explore 页面（已按项目文档 seed 数据）的整页截图。请核对：①是否渲染出**多于 1 张** entry 卡片？请给出大致卡片数量。②每张卡片的时间文本是否都含 GMT±N 偏移标识且**不含** "ago"/"just now"？请抄录 2~3 条时间文本原样。另外：是否存在布局溢出、文字被裁切、元素重叠遮挡、空白破图等 blocker 级视觉缺陷？请最后单独一行给出 "Blocker 数量: N"。 || 这是 PeekView 一个 **8 个文件**的 entry 卡片（局部截图）。请核对：卡片元信息区是否显示了形如 "8 files" 的文件数文本？请把元信息区文字原样抄录。另外：是否存在布局溢出、文字被裁切、元素重叠遮挡、空白破图等 blocker 级视觉缺陷？请最后单独一行给出 "Blocker 数量: N"。 || 这是 PeekView 一个 **1 个文件**的 entry 卡片（局部截图）。请核对：卡片元信息区是否**没有**显示任何文件数文本（即没有 "1 file"/"1 files"）？请把元信息区文字原样抄录。另外：是否存在布局溢出、文字被裁切、元素重叠遮挡、空白破图等 blocker 级视觉缺陷？请最后单独一行给出 "Blocker 数量: N"。'
  summary:
    blocker_count: 0
    notes: ① 是，渲染出了多于 1 张 entry 卡片。共 5 行，每行 4 张，总计 **20 张**卡片。
  per_image:
  - image: bdd-26-seeded-explore.png
    prompt: '这是 PeekView Explore 页面（已按项目文档 seed 数据）的整页截图。请核对：①是否渲染出**多于 1 张** entry 卡片？请给出大致卡片数量。②每张卡片的时间文本是否都含 GMT±N 偏移标识且**不含** "ago"/"just now"？请抄录 2~3 条时间文本原样。另外：是否存在布局溢出、文字被裁切、元素重叠遮挡、空白破图等 blocker 级视觉缺陷？请最后单独一行给出 "Blocker 数量: N"。'
    model: xrouter/nx-vision
    blocker_count: 0
    rc: 0
    response: '① 是，渲染出了多于 1 张 entry 卡片。共 5 行，每行 4 张，总计 **20 张**卡片。


      ② 每张卡片的时间文本均包含 `GMT+8` 偏移标识，且没有出现 "ago" 或 "just now"。抄录如下：

      - `11/11/2026, 02:31:35 AM GMT+8`

      - `11/11/2026, 02:31:30 AM GMT+8`

      - `11/11/2026, 02:31:30 AM GMT+8`


      ③ 全页检查未发现布局溢出、文字被裁切、元素重叠遮挡或空白破图等 blocker 级视觉缺陷。整体布局规整，卡片内容完整清晰。


      Blocker 数量: 0'
  - image: bdd-26-unicode-filenames-card.png
    prompt: '这是 PeekView 一个 **8 个文件**的 entry 卡片（局部截图）。请核对：卡片元信息区是否显示了形如 "8 files" 的文件数文本？请把元信息区文字原样抄录。另外：是否存在布局溢出、文字被裁切、元素重叠遮挡、空白破图等 blocker 级视觉缺陷？请最后单独一行给出 "Blocker 数量: N"。'
    model: xrouter/nx-vision
    blocker_count: 0
    rc: 0
    response: '是的，卡片元信息区显示了形如 "8 files" 的文件数文本。


      元信息区文字原样抄录如下：

      ```

