  note: '立项：修正 TPV0102 引入的时间主显格式——`2026/11/10 GMT+8 17:43:00` → `2026/11/10 17:43`（去时区名、
    去秒），时区信息全部留在悬停 tooltip（保持 `just now · 2026/11/10 17:43:00 GMT+08:00 · Asia/Shanghai`）。
    **本质是推翻 TPV0102 P0 决策 1.3 的「强制带时区名」**：用户看到 v0.27.0 实际效果后质疑「这样的 GMT+8 应该出现在
    普通用户界面么？为什么其他网站都没有这种表达？」→ 质疑成立，三条理由：①「消除歧义」前提不成立（主显由浏览器时区
    决定，就是用户本地时间，无歧义）②「无需配置」不构成选择理由（所有方案共有）③ GMT+8 是机器可读格式，用户界面有
    浏览器时区这一上下文故成噪音（业界 GitHub/Gmail 主显均不带偏移）。我的错误性质=把信息完备性套用到人读界面且未对标
    真实产品。**不走 hotfix 的理由**：T074 先例判据是「≤3 行 + 现成测试覆盖」，本次生产代码虽约 3 行但 5 个测试文件
    **26 处断言正是在断言 GMT±N**（改格式即改判据），hotfix 会变成「自己改标准+自己判通过」。risk=low（纯前端展示层、
    无 schema/API/权限）、follows_existing_pattern（useRelativeTime 结构不变）、ui_affected=true。**已实测输出**：zh-CN
    → `2026/11/10 17:43`（对 /GMT|UTC|[+-]\\d/ 无命中）、en-US → `11/10/2026, 05:43 PM`（12 小时制，建议不加 hour12:false
    以免覆盖 locale 习惯）。范围严格：不改 formatTooltip / 不改相对时间 / 后端零改动'
